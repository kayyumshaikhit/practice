name: My First Workflow

# 1. Define the Event (Trigger)
on:
  push:
    branches: [ "main" ]

# 2. Define the Jobs
jobs:
  build:
    runs-on: ubuntu-latest # Runs on a fresh Ubuntu virtual machine

    steps:
    # Step 3: Check out your repository code into the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 4: Run a simple command
    - name: Print Hello Message
      run: echo "Hello, GitHub Actions is working!"
